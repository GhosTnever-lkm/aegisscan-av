name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: python -m pip install build
      - run: python -m pip install -e ".[test]"
      - run: coverage run --branch --source=aegisscan -m unittest discover -s tests -v
      - run: coverage report --fail-under=80
      - run: python -m build
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "AegisScan AV $GITHUB_REF_NAME" --generate-notes
          fi
